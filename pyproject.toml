[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "sched-rl-gym"
version = "0.2.0"
description = "Gymnasium environment for HPC job scheduling"
readme = "README.rst"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Renato L. de F. Cunha", email = "renatocunha@acm.org" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
]
keywords = ["gymnasium", "reinforcement learning", "artificial intelligence", "scheduling"]
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.24",
    "intervaltree>=3.0",
    "parallelworkloads",
]

[tool.uv.sources]
parallelworkloads = { git = "https://github.com/renatolfc/parallelworkloads.git" }

[tool.uv.extra-build-dependencies]
parallelworkloads = ["cython", "setuptools"]

[project.optional-dependencies]
render = [
    "matplotlib",
    "pyglet",
]
test = [
    "pytest>=7.0",
    "pytest-cov",
    "coverage>=7.0",
    "curl_cffi",
    "ruff",
]
docs = [
    "sphinx",
    "docutils",
    "nbsphinx",
]
all = [
    "sched-rl-gym[render,test,docs]",
]

[project.urls]
Homepage = "https://github.com/renatolfc/sched-rl-gym"
"Bug Tracker" = "https://github.com/renatolfc/sched-rl-gym/issues"
Source = "https://github.com/renatolfc/sched-rl-gym"

[tool.maturin]
python-source = "."
module-name = "schedgym._schedgym_rs"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["schedgym"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["schedgym"]
omit = ["schedgym/test_*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E741"]
